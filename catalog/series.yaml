# Серии номеров документов.
#
# ВНИМАНИЕ. Этот файл ждёт подтверждения человека — вопрос Q5 в docs/questions.md.
# Пока не подтверждён формат номера и полный перечень серий, номера нигде не
# присваиваются: номер утверждённого документа имеет юридические последствия,
# и придумывать его нельзя (CLAUDE.md, п. 4.8 — решение трудно отменить).
#
# Счётчик ведётся отдельно на каждую тройку: компания × серия × год.
# Номер присваивается в момент утверждения, под блокировкой строки счётчика.

version: 1
status: требует подтверждения

# Формат номера. Принято по умолчанию, отменяется ответом на Q5.
#   {number} — порядковый номер в серии за год, без ведущих нулей
#   {series} — код серии
#   {year}   — год, по которому ведётся счётчик
format: "{number}-{series}/{year}"
example: "12-К/2026"

# По какому году ведётся счётчик. Принято по умолчанию: по году утверждения,
# потому что именно тогда номер и присваивается. Отменяется ответом на Q5.
year_source: approval_date

series:
  - id: К
    title: { ru: Приказы по личному составу }
    sections: [hr]

  - id: ОД
    title: { ru: Приказы по основной деятельности }
    sections: [hr, corporate, finance, administration, it-security, hse]

  - id: ТД
    title: { ru: Трудовые договоры }
    sections: [hr]

  - id: Д
    title: { ru: Договоры с контрагентами }
    sections: [legal, procurement-sales, warehouse, administration, it-security, marketing]

  - id: Дов
    title: { ru: Доверенности }
    sections: [legal]

  - id: Исх
    title: { ru: Исходящая корреспонденция }
    sections: [legal, administration]

  - id: Вх
    title: { ru: Входящая корреспонденция }
    sections: [administration]

  - id: Фин
    title: { ru: Финансовые документы }
    sections: [finance]

  - id: Зак
    title: { ru: Закупочные документы }
    sections: [procurement-sales]

  - id: Скл
    title: { ru: Складские документы }
    sections: [warehouse]

# Какой документ к какой серии относится, определяется в catalog/documents/*.yaml
# при наполнении каталога (этап 8 роадмапа).
