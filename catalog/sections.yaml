# Разделы и подразделы системы.
#
# Отсюда строится меню сайта и экран «Создать документ». Разделы — это данные,
# а не код: новый раздел не требует программиста (docs/architecture.md, п. 1).
#
# id используется в правах доступа: <раздел>.<профиль>.<действие>, например
# hr.sensitive.view. Менять id после запуска нельзя — он попадёт в роли и токены.
#
# Источник: catalog/source/documents-list.txt.

