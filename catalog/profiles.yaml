# Профили доступа к документам.
#
# Профиль отвечает на вопрос «насколько узок круг людей у этого документа».
# Вместе с разделом он образует право: <раздел>.<профиль>.<действие>,
# например hr.sensitive.view.
#
# Источник: docs/architecture.md, п. 5.

version: 1

profiles:
  - id: standard
    order: 1
    title: { ru: Обычные документы раздела }
    description:
      ru: Приказы, договоры, накладные, акты. Видны тем, у кого есть право на раздел.
    examples: [Приказ о приёме на работу, Договор поставки, Акт выполненных работ]

  - id: sensitive
    order: 2
    title: { ru: Узкий круг }
    description:
      ru: >-
        Оклады, взыскания, решения участников, кредиты, инциденты ИБ,
        несчастные случаи. Требует отдельного права, даже если раздел доступен.
    examples: [Приказ об изменении оклада, Приказ о дисциплинарном взыскании, Журнал инцидентов ИБ]

  - id: policy
    order: 3
    title: { ru: Положения и политики }
    description:
      ru: Читают все работники компании и ознакамливаются под подпись.
    examples: [Правила трудового распорядка, Политика информационной безопасности]

  - id: register
    order: 4
    title: { ru: Журналы и реестры }
    description:
      ru: >-
        Собираются из данных системы или ведутся записями вручную.
        Не создаются как отдельный документ из шаблона.
    examples: [Журнал регистрации приказов, Реестр договоров, Журнал учёта ключей]

  - id: self-service
    order: 5
    title: { ru: Заявления и заявки }
    description:
      ru: Подаёт любой работник о себе, без права на раздел.
    examples: [Заявление на отпуск, Заявка на закупку, Авансовый отчёт]

  - id: external
    order: 6
    title: { ru: Внешние документы }
    description:
      ru: >-
        Создаются в других системах и только загружаются в DocFlow.
        Шаблона и формы у них нет.
    examples: [ЭСФ, Налоговые формы, Финансовая отчётность, Платёжное поручение]
