# fail2ban: блокировка адреса, с которого подбирают пароль на сайт DocFlow.
# Ставится как /etc/fail2ban/jail.d/docflow-caddy.local; путь к журналу
# вместо @LOGPATH@ подставляет deploy/setup-server.sh.
#
# 10 неверных паролей за 10 минут – адрес закрыт на час, при повторах –
# вдвое дольше каждый раз, до недели. Человек, ошибившийся несколько раз,
# под блокировку не попадает; перебор (bcrypt даёт около попытки в секунду)
# останавливается после десятой.
#
# Сайт работает в Docker, а проброшенные порты Docker идут мимо цепочки
# INPUT: блокировка ставится в цепочку DOCKER-USER, иначе она ничего бы не
# закрыла. Адреса сетей Docker (172.16.0.0/12) не блокируем: от их имени
# Docker сам передаёт часть запросов (IPv6), и блокировка такого адреса
# закрыла бы сайт для всех.

[docflow-caddy]
enabled  = true
filter   = docflow-caddy
backend  = auto
logpath  = @LOGPATH@
maxretry = 10
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.maxtime   = 1w
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
action   = iptables-allports[name=docflow-caddy, chain=DOCKER-USER, protocol=all]
