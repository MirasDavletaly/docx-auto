# fail2ban: подбор пароля на сайт DocFlow (docs/deploy.md, «Защита от
# подбора пароля»). Ставится как /etc/fail2ban/filter.d/docflow-caddy.conf
# (deploy/setup-server.sh).
#
# Неверный пароль – строка журнала Caddy (JSON), где запрос пришёл с паролем
# (заголовок Authorization; в журнале он заменён на REDACTED) и получил 401.
# Первый запрос браузера – без пароля, тоже 401, но без Authorization: его
# не считаем, иначе блокировали бы каждого, кто просто открыл сайт.
#
# Подделать такую строку через адрес страницы или заголовки нельзя: кавычки
# внутри значений в JSON экранируются (\"), а шаблон ищет настоящие.
# Проверено fail2ban-regex на журнале Caddy 2.11 (docs/security-review-2026-09.md).

[Definition]
failregex = ^.*"client_ip":"<HOST>".*"Authorization":\["REDACTED"\].*"status":401,
ignoreregex =
datepattern = "ts":{EPOCH}
